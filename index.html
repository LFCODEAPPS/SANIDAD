<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Sanidad</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: var(--primary-color);
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Sanidad</h2>
        <form id="sanidadForm">
            
            <div class="form-group">
                <label for="semana">Semana:</label>
                <input type="text" id="semana" name="semana" required placeholder="Ej: Semana 40">
            </div>

            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="nCama">N. de Cama:</label>
                <input type="text" id="nCama" name="nCama" required placeholder="Ej: Cama 01">
            </div>

            <div class="form-group">
                <label for="nLote">N. de Lote:</label>
                <input type="text" id="nLote" name="nLote" required placeholder="Ej: Lote 02">
            </div>

            <div class="form-group">
                <label for="plagas">Plagas:</label>
                <input type="text" id="plagas" name="plagas" placeholder="Ej: Pulgón, Ninguna">
            </div>

            <div class="form-group">
                <label for="totalPlantas">Total de Plantas:</label>
                <input type="number" id="totalPlantas" name="totalPlantas" required placeholder="Ej: 90">
            </div>

            <div class="form-group">
                <label for="foto">Foto de Registro:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">Guardar Registro</button>
            <div id="loading">Enviando datos y subiendo foto... Por favor, espere.</div>
            <div id="message"></div>
        </form>
    </div>

    <script>
        // URL de tu Web App de Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdqfRnQR0s5chwFngbmDPjpaCkX7UMp40OiZRGI0ChKUrcgzB-GmERAg2LlPudVMoM/exec";

        const form = document.getElementById('sanidadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            loading.style.display = 'block';
            messageDiv.textContent = '';

            const archivoInput = document.getElementById('foto');
            const file = archivoInput.files[0];

            if (file) {
                // Validación para evitar que fotos muy pesadas colapsen la petición
                if (file.size > 5 * 1024 * 1024) {
                    alert("La foto es demasiado pesada. Por favor, elige una imagen más pequeña.");
                    loading.style.display = 'none';
                    submitBtn.disabled = false;
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64String = event.target.result;
                    enviarDatos(base64String, file.name, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                enviarDatos("", "", "");
            }
        });

        function enviarDatos(fotoBase64, fotoNombre, fotoMimeType) {
            const datos = {
                semana: document.getElementById('semana').value,
                fecha: document.getElementById('fecha').value,
                nCama: document.getElementById('nCama').value,
                nLote: document.getElementById('nLote').value,
                plagas: document.getElementById('plagas').value,
                totalPlantas: document.getElementById('totalPlantas').value,
                fotoBase64: fotoBase64,
                fotoNombre: fotoNombre,
                fotoMimeType: fotoMimeType
            };

            // Se usa mode: 'no-cors' para permitir la comunicación correcta con Google Apps Script
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                form.reset();
                messageDiv.style.color = 'green';
                messageDiv.textContent = "¡Registro guardado con éxito en Google Sheets!";
            })
            .catch(error => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                messageDiv.style.color = 'red';
                messageDiv.textContent = "Hubo un error al enviar. Inténtalo de nuevo.";
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
