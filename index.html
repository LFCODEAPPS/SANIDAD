<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Sanidad</title>
    <style>
        :root {
            --primary-color: #2b9348;
            --primary-bg: #e8f5e9;
            --text-color: #333;
            --page-bg: #f4f7f6;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            margin-top: 20px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }

        .header-title {
            color: var(--primary-color);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.3rem;
            font-weight: 800;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: span 2; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
        }
        
        button.action-btn:hover { opacity: 0.9; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h2 class="header-title">Registro de Sanidad</h2>
    </div>
    <div class="subtitle">Sistema de Control de Cultivos y Plagas</div>

    <form id="sanidadForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="semana">Semana</label>
                <input type="text" id="semana" placeholder="Ej: Semana 40" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Registro</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="nCama">N. de Cama</label>
                <input type="text" id="nCama" placeholder="Ej: 1" required>
            </div>

            <div class="form-group">
                <label for="nLote">N. de Lote</label>
                <input type="text" id="nLote" placeholder="Ej: 2" required>
            </div>

            <div class="form-group full-width">
                <label for="plagas">Plagas Encontradas</label>
                <input type="text" id="plagas" placeholder="Ej: Ninguna, Pulgón, etc.">
            </div>

            <div class="form-group">
                <label for="totalPlantas">Total de Plantas</label>
                <input type="number" id="totalPlantas" placeholder="Ej: 90" required>
            </div>

            <div class="form-group">
                <label for="foto">Foto de Registro</label>
                <input type="file" id="foto" accept="image/*">
            </div>
        </div>

        <div class="actions">
            <button type="submit" id="btn-save" class="action-btn">Guardar Registro</button>
        </div>
    </form>
</div>

<script>
    // Tu NUEVA URL integrada
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzKcRXgn3mR3W2dR9e75z8HhIbVWsy_1xA40DUVvEhoCcMWX4bWX92Kgn2syMYPOw8u/exec";

    window.onload = function() {
        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');
        document.getElementById('fecha').value = `${yyyy}-${mm}-${dd}`;
    }

    document.getElementById('sanidadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btnSave = document.getElementById('btn-save');
        btnSave.innerText = "Guardando...";
        btnSave.disabled = true;

        const archivoInput = document.getElementById('foto');
        const file = archivoInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                enviarDatos(event.target.result, file.name, file.type);
            };
            reader.readAsDataURL(file);
        } else {
            enviarDatos("", "", "");
        }
    });

    function enviarDatos(fotoBase64, fotoNombre, fotoMimeType) {
        const datos = {
            semana: document.getElementById('semana').value,
            fecha: document.getElementById('fecha').value,
            nCama: document.getElementById('nCama').value,
            nLote: document.getElementById('nLote').value,
            plagas: document.getElementById('plagas').value,
            totalPlantas: document.getElementById('totalPlantas').value,
            fotoBase64: fotoBase64,
            fotoNombre: fotoNombre,
            fotoMimeType: fotoMimeType
        };

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            alert("¡Registro enviado con éxito! Revisa tu hoja de cálculo.");
            document.getElementById('sanidadForm').reset();
            
            const hoy = new Date();
            const dd = String(hoy.getDate()).padStart(2, '0');
            const mm = String(hoy.getMonth() + 1).padStart(2, '0');
            document.getElementById('fecha').value = `${hoy.getFullYear()}-${mm}-${dd}`;

            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Guardar Registro";
            btnSave.disabled = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un error de conexión.");
            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Guardar Registro";
            btnSave.disabled = false;
        });
    }
</script>

</body>
</html>
