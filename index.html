<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Sanidad</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Sanidad</h2>
        <form id="sanidadForm">
            
            <div class="form-group">
                <label for="semana">Semana:</label>
                <input type="text" id="semana" required placeholder="Ej: Semana 40">
            </div>

            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="nCama">N. de Cama:</label>
                <input type="text" id="nCama" required placeholder="Ej: Cama 01">
            </div>

            <div class="form-group">
                <label for="nLote">N. de Lote:</label>
                <input type="text" id="nLote" required placeholder="Ej: Lote 02">
            </div>

            <div class="form-group">
                <label for="plagas">Plagas:</label>
                <input type="text" id="plagas" placeholder="Ej: Pulgón, Ninguna">
            </div>

            <div class="form-group">
                <label for="totalPlantas">Total de Plantas:</label>
                <input type="number" id="totalPlantas" required placeholder="Ej: 90">
            </div>

            <div class="form-group">
                <label for="foto">Foto de Registro:</label>
                <input type="file" id="foto" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">Guardar Registro</button>
        </form>
    </div>

    <script>
        // Tu URL de Google Apps Script actual
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdqfRnQR0s5chwFngbmDPjpaCkX7UMp40OiZRGI0ChKUrcgzB-GmERAg2LlPudVMoM/exec";

        const form = document.getElementById('sanidadForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.innerText = "Guardando...";
            submitBtn.disabled = true;

            const archivoInput = document.getElementById('foto');
            const file = archivoInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    enviarDatosAlServidor(event.target.result, file.name, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                enviarDatosAlServidor("", "", "");
            }
        });

        function enviarDatosAlServidor(fotoBase64, fotoNombre, fotoMimeType) {
            const datos = {
                semana: document.getElementById('semana').value,
                fecha: document.getElementById('fecha').value,
                nCama: document.getElementById('nCama').value,
                nLote: document.getElementById('nLote').value,
                plagas: document.getElementById('plagas').value,
                totalPlantas: document.getElementById('totalPlantas').value,
                fotoBase64: fotoBase64,
                fotoNombre: fotoNombre,
                fotoMimeType: fotoMimeType
            };

            // Estructura exacta de envío idéntica a tu app funcional
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(() => {
                alert("¡Registro guardado con éxito en Google Sheets!");
                form.reset();
                submitBtn.innerText = "Guardar Registro";
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Hubo un error al registrar los datos.");
                submitBtn.innerText = "Guardar Registro";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
