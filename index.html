<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Bloqueo total de Zoom por pellizco -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inka's Berries | Sanidad</title>
    <style>
        :root {
            --primary-color: #2b9348;
            --primary-bg: #e8f5e9;
            --text-color: #333;
            --page-bg: #f4f7f6;
            --border-color: #ced4da;
            --readonly-bg: #e9ecef;
        }

        /* Bloqueo de doble toque y selección para evitar zoom accidental en móviles */
        * {
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .login-view {
            text-align: center;
        }

        .company-logo {
            width: 110px;
            height: auto;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .company-title {
            color: var(--primary-color);
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .view { display: none; }
        .view.active { display: block; }

        .brand-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title {
            color: var(--primary-color);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(43, 147, 72, 0.15);
        }

        /* Estilo para campos bloqueados/grises */
        input:read-only {
            background-color: var(--readonly-bg);
            color: #495057;
            font-weight: 600;
        }

        .actions {
            margin-top: 20px;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(43, 147, 72, 0.2);
        }
        
        button.action-btn:active { transform: scale(0.98); }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .logout-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .user-tag {
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- VISTA 1: LOGIN -->
    <div id="view-login" class="view active login-view">
        <img src="inkas.png" alt="Inka's Berries Logo" class="company-logo">
        <h1 class="company-title">Inka's Berries | Peru</h1>
        
        <div class="login-box">
            <div class="form-group">
                <label for="loginUser">Usuario</label>
                <input type="text" id="loginUser" placeholder="Ingrese su usuario" autocomplete="off" autocapitalize="characters">
            </div>
            
            <div class="form-group">
                <label for="loginPin">PIN</label>
                <input type="password" id="loginPin" maxlength="6" placeholder="Ingrese su PIN" autocomplete="off">
            </div>

            <div id="login-error" class="error-msg">Usuario o PIN incorrectos.</div>

            <button type="button" class="action-btn" id="btnLogin" onclick="verificarLogin()" style="margin-top: 5px;">Ingresar</button>
        </div>
    </div>

    <!-- VISTA 2: FORMULARIO DE SANIDAD -->
    <div id="view-form" class="view">
        <div class="logout-container">
            <span class="user-tag" id="displayUser">Usuario: </span>
            <button type="button" class="logout-btn" onclick="cerrarSesion()">🔒 Cerrar Sesión</button>
        </div>
        
        <div class="brand-header">
            <h2 class="header-title">Control de Sanidad</h2>
            <div class="subtitle">Registro de Cultivos y Plagas</div>
        </div>

        <form id="sanidadForm">
            <div class="form-group">
                <label for="evaluador">Evaluador(a)</label>
                <input type="text" id="evaluador" readonly>
            </div>

            <div class="form-group">
                <label for="semana">Semana</label>
                <input type="text" id="semana" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Registro</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="nCama">N. de Cama</label>
                <input type="number" inputmode="numeric" id="nCama" placeholder="Ej: 1" required>
            </div>

            <div class="form-group">
                <label for="nLote">N. de Lote</label>
                <input type="number" inputmode="numeric" id="nLote" placeholder="Ej: 2" required>
            </div>

            <div class="form-group">
                <label for="plagas">Plagas Encontradas</label>
                <input type="text" id="plagas" placeholder="Ej: Ninguna, Pulgón, etc.">
            </div>

            <div class="form-group">
                <label for="totalPlantas">Total de Plantas</label>
                <input type="number" inputmode="numeric" id="totalPlantas" placeholder="Ej: 90" required>
            </div>

            <div class="form-group">
                <label for="foto">Foto de Registro</label>
                <input type="file" id="foto" accept="image/*">
            </div>

            <div class="actions">
                <button type="submit" id="btn-save" class="action-btn">Guardar Registro</button>
            </div>
        </form>
    </div>

</div>

<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzKcRXgn3mR3W2dR9e75z8HhIbVWsy_1xA40DUVvEhoCcMWX4bWX92Kgn2syMYPOw8u/exec";

    function cambiarVista(vista) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        if (vista === 'login') document.getElementById('view-login').classList.add('active');
        if (vista === 'form') document.getElementById('view-form').classList.add('active');
    }

    async function verificarLogin() {
        const usuarioInput = document.getElementById('loginUser').value.trim().toUpperCase();
        const pinInput = document.getElementById('loginPin').value.trim();
        const errorBox = document.getElementById('login-error');
        const btnLogin = document.getElementById('btnLogin');

        if (!usuarioInput || !pinInput) {
            errorBox.textContent = "Por favor, ingrese usuario y PIN.";
            errorBox.style.display = "block";
            return;
        }

        btnLogin.innerText = "Verificando...";
        btnLogin.disabled = true;
        errorBox.style.display = "none";

        try {
            const response = await fetch(URL_APPS_SCRIPT + "?action=usuarios");
            const usuarios = await response.json();
            
            let encontrado = false;
            usuarios.forEach(u => {
                if (u.usuario.toUpperCase() === usuarioInput && String(u.pin) === String(pinInput)) {
                    encontrado = true;
                }
            });

            if (encontrado) {
                // Autenticación correcta: configurar datos automáticos del formulario
                document.getElementById('evaluador').value = usuarioInput;
                document.getElementById('displayUser').innerText = "Conectado: " + usuarioInput;
                
                // Calcular semana actual aproximada y fecha de hoy por defecto
                const hoy = new Date();
                document.getElementById('fecha').value = hoy.toISOString().split('T')[0];
                document.getElementById('semana').value = "Semana " + obtenerNumeroSemana(hoy);

                document.getElementById('loginUser').value = '';
                document.getElementById('loginPin').value = '';
                cambiarVista('form');
            } else {
                errorBox.textContent = "Usuario o PIN incorrectos.";
                errorBox.style.display = "block";
            }
        } catch (error) {
            console.error('Error al verificar usuarios:', error);
            errorBox.textContent = "Error de conexión con el servidor.";
            errorBox.style.display = "block";
        } finally {
            btnLogin.innerText = "Ingresar";
            btnLogin.disabled = false;
        }
    }

    // Función auxiliar para calcular el número de semana del año actual
    function obtenerNumeroSemana(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var inicioAno = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        var semanaNo = Math.ceil((((d - inicioAno) / 86400000) + 1)/7);
        return semanaNo;
    }

    function cerrarSesion() {
        cambiarVista('login');
    }

    document.getElementById('sanidadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btnSave = document.getElementById('btn-save');
        btnSave.innerText = "Guardando...";
        btnSave.disabled = true;

        const archivoInput = document.getElementById('foto');
        const file = archivoInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                enviarDatos(event.target.result, file.name, file.type);
            };
            reader.readAsDataURL(file);
        } else {
            enviarDatos("", "", "");
        }
    });

    function enviarDatos(fotoBase64, fotoNombre, fotoMimeType) {
        const datos = {
            semana: document.getElementById('semana').value,
            fecha: document.getElementById('fecha').value,
            evaluador: document.getElementById('evaluador').value,
            nCama: document.getElementById('nCama').value,
            nLote: document.getElementById('nLote').value,
            plagas: document.getElementById('plagas').value,
            totalPlantas: document.getElementById('totalPlantas').value,
            fotoBase64: fotoBase64,
            fotoNombre: fotoNombre,
            fotoMimeType: fotoMimeType
        };

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            alert("¡Registro guardado con éxito!");
            
            // Limpiar solo los campos variables (mantiene evaluador, semana y fecha actuales para agilizar registros seguidos)
            document.getElementById('nCama').value = '';
            document.getElementById('nLote').value = '';
            document.getElementById('plagas').value = '';
            document.getElementById('totalPlantas').value = '';
            document.getElementById('foto').value = '';

            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Guardar Registro";
            btnSave.disabled = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un error de conexión.");
            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Guardar Registro";
            btnSave.disabled = false;
        });
    }
</script>

</body>
</html>
